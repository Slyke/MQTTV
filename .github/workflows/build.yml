name: Build Android and Tizen
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore stable debug signing key when configured
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
      - name: Test, lint and build APK
        working-directory: mqtt-client
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Collect APK
        run: |
          mkdir -p artifacts
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" mqtt-client/app/build.gradle)
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "v$VERSION"; fi
          cp mqtt-client/app/build/outputs/apk/debug/app-debug.apk "artifacts/TV-MQTT-API-Client-v${VERSION}.apk"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: android-apk
          path: artifacts/*.apk
          if-no-files-found: error
  tizen:
    name: Samsung Tizen WGT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tizen-client/package-lock.json
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: tizen-client
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test and build WGT
        working-directory: tizen-client
        run: |
          npm run check
          npm test
          npm run build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: tizen-wgt
          path: tizen-client/dist/*.unsigned.wgt
          if-no-files-found: error
